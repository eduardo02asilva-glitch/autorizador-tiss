<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Autorizador TISS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    
    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-lg p-4 mb-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🏥 Autorizador TISS - Dashboard
            </h1>
            <div id="userInfo" class="hidden flex items-center gap-4">
                <span id="userEmail" class="text-sm bg-indigo-800 px-3 py-1 rounded-full"></span>
                <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 px-3 py-1 rounded transition">Sair</button>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4">
        <!-- Tela de Login -->
        <div id="loginSection" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-200 mt-10">
            <h2 class="text-2xl font-bold mb-6 text-slate-700 text-center">Acesso ao Sistema</h2>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">E-mail</label>
                    <input type="email" id="email" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Senha</label>
                    <input type="password" id="senha" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-2.5 rounded-lg transition">Entrar</button>
            </form>
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden text-center"></p>
        </div>

        <!-- Painel Principal (Apenas Logado) -->
        <div id="dashboardSection" class="hidden space-y-6">
            
            <!-- Cards de Ações -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Nova Solicitação -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold mb-4 text-slate-700">Nova Solicitação TISS</h3>
                    <form onsubmit="handleNovaSolicitacao(event)" class="space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">ID Clínica</label>
                                <input type="number" id="solClinicaId" required class="w-full border p-2 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">ID Paciente</label>
                                <input type="number" id="solPacienteId" required class="w-full border p-2 rounded text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Procedimento</label>
                            <input type="text" id="solProcedimento" placeholder="Ex: 40304364 - Hemograma" required class="w-full border p-2 rounded text-sm">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg text-sm transition">
                            Criar Solicitação
                        </button>
                    </form>
                </div>

                <!-- Validador de XML -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold mb-4 text-slate-700">Validar Ficheiro XML TISS</h3>
                    <form onsubmit="handleValidarXML(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Selecione o arquivo .xml</label>
                            <input type="file" id="xmlFile" accept=".xml" required class="w-full border p-1.5 rounded text-sm">
                        </div>
                        <button type="submit" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-semibold py-2 rounded-lg text-sm transition">
                            Validar XML
                        </button>
                    </form>
                    <div id="xmlResult" class="mt-3 text-xs p-2.5 rounded hidden"></div>
                </div>
            </div>

            <!-- Tabela de Solicitações -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-slate-700">Solicitações Recentes</h3>
                    <button onclick="carregarSolicitacoes()" class="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded text-slate-600 font-medium">
                        🔄 Atualizar Tabela
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 uppercase text-xs border-b">
                            <tr>
                                <th class="p-3">ID</th>
                                <th class="p-3">Clínica</th>
                                <th class="p-3">Paciente</th>
                                <th class="p-3">Procedimento</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaSolBody" class="divide-y divide-slate-100">
                            <!-- Injetado dinamicamente via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
