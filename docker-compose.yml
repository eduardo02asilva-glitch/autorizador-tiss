version: '3.8'

services:
  db:
    image: postgres:15
    container_name: autorizador_tiss_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: autorizador_tiss_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: autorizador_tiss_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/autorizador_tiss_db
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: autorizador_tiss_worker
    restart: always
    command: python -m backend.app.worker
    environment:
      - BASE_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data: